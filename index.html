
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Transfer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --surface: #fff; --text: #1a1a18; --muted: #888780;
  --border: rgba(0,0,0,0.12); --green: #639922; --green-bg: #EAF3DE;
  --blue: #185FA5; --blue-bg: #E6F1FB; --red: #A32D2D; --red-bg: #FCEBEB;
  --r: 12px; --rs: 8px;
}
body { font-family: Georgia, serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; }
header { text-align: center; margin-bottom: 2rem; }
h1 { font-size: clamp(1.5rem,4vw,2rem); font-weight: normal; letter-spacing: -0.02em; margin-bottom: 0.3rem; }
header p { font-size: 0.8rem; color: var(--muted); font-family: monospace; }
.card { background: var(--surface); border-radius: var(--r); border: 1px solid var(--border); width: 100%; max-width: 480px; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { flex: 1; padding: 1rem; background: none; border: none; cursor: pointer; font-size: 0.875rem; color: var(--muted); font-family: monospace; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.panel { display: none; padding: 1.5rem; }
.panel.active { display: block; }
label { display: block; font-size: 0.7rem; font-family: monospace; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.4rem; }
.upload-zone { border: 1.5px dashed var(--border); border-radius: var(--rs); padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.15s; margin-bottom: 1rem; }
.upload-zone:hover { border-color: var(--muted); background: var(--bg); }
.upload-zone p { font-size: 0.875rem; color: var(--muted); margin-top: 0.5rem; }
textarea { width: 100%; min-height: 80px; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--rs); font-size: 0.875rem; font-family: monospace; background: var(--bg); color: var(--text); resize: vertical; outline: none; }
textarea:focus { border-color: var(--muted); }
.meta { font-size: 0.75rem; color: var(--muted); font-family: monospace; margin: 0.4rem 0 0.8rem; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 0.6rem 1.25rem; border-radius: var(--rs); font-size: 0.875rem; cursor: pointer; font-family: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all 0.15s; }
.btn:hover { background: var(--bg); }
.btn:active { transform: scale(0.97); }
.btn-solid { background: var(--text); color: var(--surface); border-color: var(--text); }
.btn-solid:hover { opacity: 0.85; background: var(--text); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
.divider { text-align: center; font-size: 0.75rem; color: var(--muted); font-family: monospace; margin: 0.75rem 0; position: relative; }
.divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
.divider::before { left: 0; } .divider::after { right: 0; }
#qr-section { display: none; margin-top: 1.5rem; text-align: center; }
#qr-canvas { border-radius: var(--rs); border: 1px solid var(--border); }
.qr-meta { font-size: 0.75rem; color: var(--muted); font-family: monospace; margin-top: 0.5rem; }
.progress-track { width: 100%; height: 3px; background: var(--bg); border-radius: 99px; margin: 0.6rem auto; max-width: 260px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--text); border-radius: 99px; transition: width 0.2s; }
.speed-btns { display: flex; gap: 6px; justify-content: center; margin-top: 0.75rem; flex-wrap: wrap; }
.speed-btn { padding: 4px 12px; font-size: 0.75rem; font-family: monospace; border: 1px solid var(--border); border-radius: 99px; background: none; cursor: pointer; color: var(--muted); transition: all 0.15s; }
.speed-btn.active { border-color: var(--text); color: var(--text); font-weight: bold; }
#cam-placeholder { width: 100%; height: 200px; background: var(--bg); border-radius: var(--rs); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 0.875rem; margin-bottom: 1rem; }
#scan-wrap { display: none; position: relative; margin-bottom: 1rem; }
#cam-video { width: 100%; border-radius: var(--rs); border: 1px solid var(--border); display: block; }
#decode-canvas { display: none; }
.scan-line { position: absolute; left: 8%; right: 8%; height: 2px; background: var(--blue); border-radius: 1px; animation: scanAnim 1.8s linear infinite; }
@keyframes scanAnim { 0%,100%{top:12%} 50%{top:80%} }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-family: monospace; margin-bottom: 0.75rem; }
.badge-wait { background: var(--bg); color: var(--muted); }
.badge-scan { background: var(--blue-bg); color: var(--blue); }
.badge-ok   { background: var(--green-bg); color: var(--green); }
.badge-done { background: var(--green-bg); color: var(--green); font-weight: bold; }
.badge-err  { background: var(--red-bg); color: var(--red); }
.frame-dots { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.5rem 0 0.75rem; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); transition: background 0.15s; }
.dot.got { background: var(--green); border-color: var(--green); }
#result-box { display: none; background: var(--bg); border-radius: var(--rs); padding: 1rem; margin-top: 1rem; }
#result-text { font-size: 0.8rem; font-family: monospace; white-space: pre-wrap; max-height: 160px; overflow-y: auto; color: var(--text); line-height: 1.6; }
#manual-area { display: none; margin-top: 0.5rem; }
.manual-instruction { font-size: 0.8rem; color: var(--text); line-height: 1.6; margin-bottom: 0.75rem; padding: 0.75rem; background: var(--blue-bg); border-radius: var(--rs); }
.frame-indicator { font-size: 1rem; font-family: monospace; font-weight: bold; text-align: center; margin: 0.5rem 0; color: var(--text); }
footer { margin-top: 2.5rem; font-size: 0.75rem; color: var(--muted); font-family: monospace; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>QR Transfer</h1>
  <p>PC → スマホ ／ カメラでデータ転送</p>
</header>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pc')" id="tab-pc">📟 PC側</button>
    <button class="tab" onclick="switchTab('sp')" id="tab-sp">📱 スマホ側</button>
  </div>

  <!-- PC側 -->
  <div class="panel active" id="panel-pc">
    <label>ファイルを選択</label>
    <div class="upload-zone" onclick="document.getElementById('file-in').click()">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0L8 8m4-4l4 4"/></svg>
      <p>.txt ファイルをクリックして選択</p>
      <input type="file" id="file-in" accept=".txt" style="display:none" onchange="loadFile(event)">
    </div>
    <div class="divider">または直接入力</div>
    <label>テキスト</label>
    <textarea id="txt-in" placeholder="ここにテキストを入力..."></textarea>
    <div class="meta" id="txt-meta"></div>
    <div class="btn-row">
      <button class="btn btn-solid" onclick="startQR()">QRアニメーション開始</button>
    </div>
    <div id="qr-section">
      <canvas id="qr-canvas" width="260" height="260"></canvas>
      <div class="qr-meta" id="qr-label">準備中...</div>
      <div class="progress-track"><div class="progress-fill" id="qr-bar" style="width:0%"></div></div>
      <div class="speed-btns">
        <button class="speed-btn" onclick="setSpeed(300,this)">速い</button>
        <button class="speed-btn active" onclick="setSpeed(700,this)">普通</button>
        <button class="speed-btn" onclick="setSpeed(1200,this)">遅い</button>
        <button class="speed-btn" id="btn-stop-qr" onclick="toggleStop(this)">停止</button>
      </div>
    </div>
  </div>

  <!-- スマホ側 -->
  <div class="panel" id="panel-sp">
    <p style="font-size:0.875rem; color:var(--muted); margin-bottom:1rem; line-height:1.6;">
      カメラでQRを読み取ります。<br>
      <strong style="color:var(--text);">自動</strong>：QRを検出して自動で進みます。<br>
      <strong style="color:var(--text);">手動</strong>：1枚ずつ「読み取る」ボタンで確実に読みます。
    </p>

    <div id="cam-placeholder">
      <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>カメラ未起動</span>
    </div>

    <div id="scan-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="scan-line" id="scan-line" style="display:none"></div>
      <canvas id="decode-canvas"></canvas>
    </div>

    <div id="badge" class="badge badge-wait">⏸ 待機中</div>

    <div id="progress-area" style="display:none">
      <div class="meta" id="recv-label">0 / ? フレーム取得済み</div>
      <div class="progress-track"><div class="progress-fill" id="recv-bar" style="width:0%"></div></div>
      <div class="frame-dots" id="dots"></div>
    </div>

    <div id="manual-area">
      <div class="manual-instruction">
        📋 PC側でQRを<strong>停止</strong>させてから「読み取る」を押してください。読み取れたら次のフレームへ進んでください。
      </div>
      <div class="frame-indicator" id="manual-frame-label">フレーム 1 を読み取ってください</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-solid" onclick="manualScan()" id="btn-manual-scan">📷 このQRを読み取る</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-solid" onclick="startCam('auto')" id="btn-auto">自動で読み取る</button>
      <button class="btn" onclick="startCam('manual')" id="btn-manual">手動で読み取る</button>
      <button class="btn" onclick="stopCam()" id="btn-stop-cam" style="display:none">停止</button>
      <button class="btn" onclick="resetScan()" id="btn-reset" style="display:none">リセット</button>
    </div>

    <div id="result-box">
      <label>受信したテキスト</label>
      <div id="result-text"></div>
      <div class="btn-row">
        <button class="btn btn-solid" onclick="saveTxt()">💾 .txt として保存</button>
      </div>
    </div>
  </div>
</div>

<footer>QR Transfer v2.3 — no data leaves your device</footer>

<script>
const CHUNK = 50;

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('panel-'+t).classList.add('active');
}

// ===== PC側 =====
let qrTimer=null, qrFrames=[], qrImages=[], qrIdx=0, qrSpeed=700;

document.getElementById('txt-in').addEventListener('input', updateMeta);

function loadFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('txt-in').value = ev.target.result; updateMeta(); };
  r.readAsText(f, 'UTF-8');
}

function updateMeta() {
  const t = document.getElementById('txt-in').value;
  const b = new TextEncoder().encode(t).length;
  const n = Math.ceil(b / CHUNK);
  document.getElementById('txt-meta').textContent = b > 0 ? `${b} bytes → ${n} フレーム` : '';
}

function chunk(str, size) {
  const a = [];
  for (let i = 0; i < str.length; i += size) a.push(str.slice(i, i + size));
  return a;
}

function generateQRDataUrl(text) {
  return new Promise(resolve => {
    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
    document.body.appendChild(tmp);
    new QRCode(tmp, { text, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
    setTimeout(() => {
      const el = tmp.querySelector('canvas') || tmp.querySelector('img');
      const src = el ? (el.tagName==='CANVAS' ? el.toDataURL() : el.src) : '';
      document.body.removeChild(tmp);
      resolve(src);
    }, 150);
  });
}

async function startQR() {
  const text = document.getElementById('txt-in').value.trim();
  if (!text) { alert('テキストを入力してください'); return; }
  stopQR();
  const chunks = chunk(text, CHUNK);
  qrFrames = chunks.map((d, i) => JSON.stringify({ i, t: chunks.length, d }));
  qrIdx = 0;
  document.getElementById('qr-section').style.display = 'block';
  document.getElementById('qr-label').textContent = 'QRコード生成中...';
  qrImages = [];
  for (let i = 0; i < qrFrames.length; i++) {
    document.getElementById('qr-label').textContent = `生成中 ${i+1} / ${qrFrames.length}`;
    qrImages.push(await generateQRDataUrl(qrFrames[i]));
  }
  drawFrame();
  if (qrFrames.length > 1) qrTimer = setInterval(drawFrame, qrSpeed);
}

function drawFrame() {
  if (!qrImages.length) return;
  const idx = qrIdx % qrImages.length;
  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => { ctx.clearRect(0,0,260,260); ctx.drawImage(img,0,0,260,260); };
  img.src = qrImages[idx];
  document.getElementById('qr-label').textContent = `フレーム ${idx+1} / ${qrImages.length}`;
  document.getElementById('qr-bar').style.width = ((idx+1)/qrImages.length*100)+'%';
  qrIdx = (qrIdx + 1) % qrImages.length;
}

function stopQR() {
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
}

function toggleStop(btn) {
  if (qrTimer) {
    stopQR();
    btn.textContent = '再開'; btn.classList.add('active');
  } else {
    if (qrImages.length > 1) qrTimer = setInterval(drawFrame, qrSpeed);
    btn.textContent = '停止'; btn.classList.remove('active');
  }
}

function setSpeed(ms, btn) {
  qrSpeed = ms;
  document.querySelectorAll('.speed-btn').forEach(b => { if(b.id!=='btn-stop-qr') b.classList.remove('active'); });
  btn.classList.add('active');
  if (qrTimer) { stopQR(); qrTimer = setInterval(drawFrame, qrSpeed); }
}

// ===== スマホ側 =====
let camStream=null, scanLoop=null, collected={}, totalF=null, lastRaw='', decoded='', scanMode='auto', manualIdx=0;

async function startCam(mode) {
  scanMode = mode;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width:{ideal:1280} }, audio: false });
    const v = document.getElementById('cam-video');
    v.srcObject = camStream;
    document.getElementById('cam-placeholder').style.display = 'none';
    document.getElementById('scan-wrap').style.display = 'block';
    document.getElementById('btn-auto').style.display = 'none';
    document.getElementById('btn-manual').style.display = 'none';
    document.getElementById('btn-stop-cam').style.display = '';
    document.getElementById('btn-reset').style.display = '';
    document.getElementById('progress-area').style.display = 'block';

    if (mode === 'manual') {
      document.getElementById('manual-area').style.display = 'block';
      document.getElementById('scan-line').style.display = 'none';
      setBadge('scan', '手動モード — QRを画面に合わせて「読み取る」を押す');
      updateManualLabel();
    } else {
      document.getElementById('scan-line').style.display = 'block';
      setBadge('scan', '自動読み取り中...');
      v.onloadedmetadata = () => { scanLoop = setInterval(doAutoScan, 200); };
    }
  } catch(e) {
    setBadge('err', '✕ カメラへのアクセスが拒否されました');
  }
}

function updateManualLabel() {
  const label = totalF
    ? `フレーム ${manualIdx+1} / ${totalF} を読み取ってください`
    : `フレーム ${manualIdx+1} を読み取ってください`;
  document.getElementById('manual-frame-label').textContent = label;
}

function manualScan() {
  const v = document.getElementById('cam-video');
  if (!v.videoWidth) { setBadge('err', 'カメラが準備できていません'); return; }
  const c = document.getElementById('decode-canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0);
  const imgData = ctx.getImageData(0, 0, c.width, c.height);
  const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });

  if (!code) {
    setBadge('err', '✕ QRを認識できませんでした。もう一度');
    setTimeout(() => setBadge('scan', '手動モード — 「読み取る」を押す'), 2000);
    return;
  }

  try {
    const obj = JSON.parse(code.data);
    if (typeof obj.i !== 'number' || typeof obj.d !== 'string') throw new Error();
    if (collected[obj.i] !== undefined) {
      setBadge('ok', `フレーム ${obj.i+1} はすでに取得済みです`);
      return;
    }
    collected[obj.i] = obj.d;
    totalF = obj.t;
    manualIdx = obj.i + 1;
    updateDots();
    setBadge('ok', `✓ フレーム ${obj.i+1} / ${obj.t} 取得！`);
    updateManualLabel();
    if (Object.keys(collected).length >= totalF) finish();
  } catch(e) {
    setBadge('err', '✕ QRのデータが正しくありません');
    setTimeout(() => setBadge('scan', '手動モード — 「読み取る」を押す'), 2000);
  }
}

function doAutoScan() {
  const v = document.getElementById('cam-video');
  if (!v.videoWidth || !v.videoHeight) return;
  const c = document.getElementById('decode-canvas');
  const W = Math.min(v.videoWidth, 1280);
  const H = Math.round(W * v.videoHeight / v.videoWidth);
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0, W, H);
  const imgData = ctx.getImageData(0, 0, W, H);
  const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
  if (!code || code.data === lastRaw) return;
  lastRaw = code.data;
  setTimeout(() => { if (lastRaw === code.data) lastRaw = ''; }, 1000);
  try {
    const obj = JSON.parse(code.data);
    if (typeof obj.i !== 'number' || typeof obj.d !== 'string') return;
    if (collected[obj.i] !== undefined) return;
    collected[obj.i] = obj.d;
    totalF = obj.t;
    updateDots();
    setBadge('ok', `✓ フレーム ${obj.i+1} / ${obj.t} 取得！`);
    if (Object.keys(collected).length >= totalF) finish();
  } catch(e) {}
}

function stopCam() {
  if (scanLoop) { clearInterval(scanLoop); scanLoop = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  document.getElementById('scan-line').style.display = 'none';
  document.getElementById('btn-stop-cam').style.display = 'none';
  document.getElementById('btn-auto').style.display = '';
  document.getElementById('btn-manual').style.display = '';
}

function resetScan() {
  stopCam();
  collected = {}; totalF = null; lastRaw = ''; decoded = ''; manualIdx = 0;
  document.getElementById('dots').innerHTML = '';
  document.getElementById('recv-label').textContent = '0 / ? フレーム取得済み';
  document.getElementById('recv-bar').style.width = '0%';
  document.getElementById('result-box').style.display = 'none';
  document.getElementById('cam-placeholder').style.display = 'flex';
  document.getElementById('scan-wrap').style.display = 'none';
  document.getElementById('manual-area').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('progress-area').style.display = 'none';
  setBadge('wait', '⏸ 待機中');
}

function updateDots() {
  const got = Object.keys(collected).length;
  document.getElementById('recv-label').textContent = `${got} / ${totalF||'?'} フレーム取得済み`;
  if (totalF) document.getElementById('recv-bar').style.width = (got/totalF*100)+'%';
  const container = document.getElementById('dots');
  container.innerHTML = '';
  for (let i = 0; i < (totalF||got); i++) {
    const d = document.createElement('div');
    d.className = 'dot'+(collected[i]!==undefined?' got':'');
    container.appendChild(d);
  }
}

function finish() {
  stopCam();
  let r = '';
  for (let i = 0; i < totalF; i++) r += (collected[i]||'');
  decoded = r;
  document.getElementById('result-text').textContent = r;
  document.getElementById('result-box').style.display = 'block';
  document.getElementById('manual-area').style.display = 'none';
  setBadge('done', '✓ 全フレーム受信完了！');
}

function setBadge(type, msg) {
  const b = document.getElementById('badge');
  b.className = 'badge badge-'+type;
  b.textContent = msg;
}

function saveTxt() {
  const blob = new Blob([decoded], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'received.txt';
  a.click();
}
</script>
</body>
</html>
