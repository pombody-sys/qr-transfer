<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Transfer — PCからスマホへ</title>
<script src="./qr-transfer_files/qrcode.min.js.ダウンロード"></script>
<script src="./qr-transfer_files/jsQR.min.js.ダウンロード"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --text: #1a1a18;
    --muted: #888780;
    --border: rgba(0,0,0,0.12);
    --accent: #1a1a18;
    --green: #639922;
    --green-bg: #EAF3DE;
    --blue: #185FA5;
    --blue-bg: #E6F1FB;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: normal;
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }

  header p {
    font-size: 0.875rem;
    color: var(--muted);
    font-family: 'Courier New', monospace;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 480px;
    overflow: hidden;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 1rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--muted);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .panel { display: none; padding: 1.5rem; }
  .panel.active { display: block; }

  label {
    display: block;
    font-size: 0.75rem;
    font-family: 'Courier New', monospace;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 1rem;
  }

  .upload-zone:hover { border-color: var(--muted); background: var(--bg); }

  .upload-zone p { font-size: 0.875rem; color: var(--muted); margin-top: 0.5rem; }

  textarea {
    width: 100%;
    min-height: 80px;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-family: 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: var(--muted); }

  .meta { font-size: 0.75rem; color: var(--muted); font-family: 'Courier New', monospace; margin: 0.5rem 0 1rem; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0.6rem 1.25rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .btn:hover { background: var(--bg); }
  .btn:active { transform: scale(0.97); }

  .btn-solid {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }

  .btn-solid:hover { opacity: 0.85; background: var(--text); }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 1rem; }

  .divider {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'Courier New', monospace;
    margin: 0.75rem 0;
    position: relative;
  }

  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 42%;
    height: 1px;
    background: var(--border);
  }

  .divider::before { left: 0; }
  .divider::after { right: 0; }

  /* QR display */
  #qr-section { display: none; margin-top: 1.5rem; text-align: center; }

  #qr-canvas {
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  .qr-meta {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'Courier New', monospace;
    margin-top: 0.5rem;
  }

  .progress-track {
    width: 100%;
    height: 3px;
    background: var(--bg);
    border-radius: 99px;
    margin: 0.6rem auto;
    max-width: 260px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--text);
    border-radius: 99px;
    transition: width 0.15s;
  }

  .speed-btns { display: flex; gap: 6px; justify-content: center; margin-top: 0.75rem; }

  .speed-btn {
    padding: 4px 12px;
    font-size: 0.75rem;
    font-family: 'Courier New', monospace;
    border: 1px solid var(--border);
    border-radius: 99px;
    background: none;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
  }

  .speed-btn.active { border-color: var(--text); color: var(--text); }

  /* Camera / scan */
  #camera-placeholder {
    width: 100%;
    height: 220px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 1rem;
  }

  #camera-placeholder svg { opacity: 0.4; }

  #scan-wrapper { display: none; position: relative; margin-bottom: 1rem; }

  #camera-video {
    width: 100%;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    display: block;
  }

  .scan-line {
    position: absolute;
    left: 8%;
    right: 8%;
    height: 2px;
    background: var(--blue);
    border-radius: 1px;
    animation: scanAnim 1.8s linear infinite;
    top: 20%;
  }

  @keyframes scanAnim { 0%,100%{top:12%} 50%{top:80%} }

  #decode-canvas { display: none; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.75rem;
    font-family: 'Courier New', monospace;
    margin-bottom: 1rem;
  }

  .badge-wait { background: var(--bg); color: var(--muted); }
  .badge-scan { background: var(--blue-bg); color: var(--blue); }
  .badge-done { background: var(--green-bg); color: var(--green); }
  .badge-err  { background: var(--red-bg); color: var(--red); }

  .frame-dots { display: flex; flex-wrap: wrap; gap: 4px; margin: 0.5rem 0 1rem; }

  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    transition: background 0.15s;
  }

  .dot.got { background: var(--green); border-color: var(--green); }

  #result-box {
    display: none;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 1rem;
    margin-top: 1rem;
  }

  #result-box label { margin-bottom: 0.5rem; }

  #result-text {
    font-size: 0.8125rem;
    font-family: 'Courier New', monospace;
    white-space: pre-wrap;
    max-height: 160px;
    overflow-y: auto;
    color: var(--text);
    line-height: 1.6;
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'Courier New', monospace;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>QR Transfer</h1>
  <p>PC → スマホ ／ カメラでデータ転送</p>
</header>

<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab(&#39;pc&#39;)" id="tab-pc">📟 PC側</button>
    <button class="tab" onclick="switchTab(&#39;sp&#39;)" id="tab-sp">📱 スマホ側</button>
  </div>

  <!-- ===== PC側 ===== -->
  <div class="panel active" id="panel-pc">
    <label>ファイルを選択</label>
    <div class="upload-zone" onclick="document.getElementById(&#39;file-in&#39;).click()">
      <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0L8 8m4-4l4 4"></path></svg>
      <p>.txt ファイルをクリックして選択</p>
      <input type="file" id="file-in" accept=".txt" style="display:none" onchange="loadFile(event)">
    </div>

    <div class="divider">または直接入力</div>

    <label>テキスト</label>
    <textarea id="txt-in" placeholder="ここにテキストを入力..."></textarea>
    <div class="meta" id="txt-meta"></div>

    <div class="btn-row">
      <button class="btn btn-solid" onclick="startQR()">QRアニメーション開始</button>
    </div>

    <div id="qr-section">
      <canvas id="qr-canvas" width="260" height="260"></canvas>
      <div class="qr-meta" id="qr-label">フレーム 0 / 0</div>
      <div class="progress-track">
        <div class="progress-fill" id="qr-bar" style="width:0%"></div>
      </div>
      <div class="speed-btns">
        <button class="speed-btn" onclick="setSpeed(400,this)">速い</button>
        <button class="speed-btn active" onclick="setSpeed(700,this)">普通</button>
        <button class="speed-btn" onclick="setSpeed(1100,this)">遅い</button>
        <button class="speed-btn" onclick="stopQR()">停止</button>
      </div>
    </div>
  </div>

  <!-- ===== スマホ側 ===== -->
  <div class="panel" id="panel-sp">
    <p style="font-size:0.875rem; color:var(--muted); margin-bottom:1rem; line-height:1.6;">PC画面のQRアニメーションにカメラを向けると、自動で全フレームを読み取ってテキストを復元します。</p>

    <div id="camera-placeholder">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      <span>カメラ未起動</span>
    </div>

    <div id="scan-wrapper">
      <video id="camera-video" autoplay="" playsinline="" muted=""></video>
      <div class="scan-line" id="scan-line" style="display:none"></div>
      <canvas id="decode-canvas"></canvas>
    </div>

    <div id="badge" class="badge badge-wait">⏸ 待機中</div>

    <div id="progress-area" style="display:none">
      <div class="meta" id="recv-label">0 / ? フレーム取得済み</div>
      <div class="progress-track">
        <div class="progress-fill" id="recv-bar" style="width:0%"></div>
      </div>
      <div class="frame-dots" id="dots"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-solid" onclick="startCam()" id="btn-start-cam">カメラ起動</button>
      <button class="btn" onclick="stopCam()" id="btn-stop-cam" style="display:none">停止</button>
      <button class="btn" onclick="resetScan()" id="btn-reset" style="display:none">リセット</button>
    </div>

    <div id="result-box">
      <label>受信したテキスト</label>
      <div id="result-text"></div>
      <div class="btn-row">
        <button class="btn btn-solid" onclick="saveTxt()">💾 .txt として保存</button>
      </div>
    </div>
  </div>
</div>

<footer>phase 2 — QR Transfer / works offline / no data leaves your device</footer>

<script>
// ===== PC側 =====
let qrTimer = null, qrFrames = [], qrIdx = 0, qrSpeed = 700;

document.getElementById('txt-in').addEventListener('input', updateMeta);

function loadFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('txt-in').value = ev.target.result; updateMeta(); };
  r.readAsText(f, 'UTF-8');
}

function updateMeta() {
  const t = document.getElementById('txt-in').value;
  const b = new TextEncoder().encode(t).length;
  const n = Math.ceil(b / 200);
  document.getElementById('txt-meta').textContent = b > 0 ? `${b} bytes → ${n} フレーム` : '';
}

function chunk(str, size) {
  const a = [];
  for (let i = 0; i < str.length; i += size) a.push(str.slice(i, i + size));
  return a;
}

function startQR() {
  const text = document.getElementById('txt-in').value.trim();
  if (!text) { alert('テキストを入力してください'); return; }
  stopQR();
  const chunks = chunk(text, 200);
  qrFrames = chunks.map((d, i) => JSON.stringify({ i, t: chunks.length, d }));
  qrIdx = 0;
  document.getElementById('qr-section').style.display = 'block';
  drawFrame();
  qrTimer = setInterval(drawFrame, qrSpeed);
}

function drawFrame() {
  const canvas = document.getElementById('qr-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 260, 260);
  const tmp = document.createElement('div');
  new QRCode(tmp, { text: qrFrames[qrIdx], width: 260, height: 260, correctLevel: QRCode.CorrectLevel.L });
  setTimeout(() => {
    const el = tmp.querySelector('canvas') || tmp.querySelector('img');
    if (!el) return;
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, 260, 260);
    img.src = el.tagName === 'CANVAS' ? el.toDataURL() : el.src;
  }, 30);
  document.getElementById('qr-label').textContent = `フレーム ${qrIdx + 1} / ${qrFrames.length}`;
  document.getElementById('qr-bar').style.width = ((qrIdx + 1) / qrFrames.length * 100) + '%';
  qrIdx = (qrIdx + 1) % qrFrames.length;
}

function stopQR() {
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
}

function setSpeed(ms, btn) {
  qrSpeed = ms;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (qrTimer) { stopQR(); qrTimer = setInterval(drawFrame, qrSpeed); }
}

// ===== スマホ側 =====
let camStream = null, scanLoop = null, collected = {}, total = null, lastRaw = '', decoded = '';

async function startCam() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = document.getElementById('camera-video');
    v.srcObject = camStream;
    document.getElementById('camera-placeholder').style.display = 'none';
    document.getElementById('scan-wrapper').style.display = 'block';
    document.getElementById('scan-line').style.display = 'block';
    document.getElementById('btn-start-cam').style.display = 'none';
    document.getElementById('btn-stop-cam').style.display = '';
    document.getElementById('btn-reset').style.display = '';
    document.getElementById('progress-area').style.display = 'block';
    setBadge('scan', '▶ 読み取り中...');
    v.onloadedmetadata = () => { scanLoop = setInterval(doScan, 180); };
  } catch(e) {
    setBadge('err', '✕ カメラへのアクセスが拒否されました');
  }
}

function stopCam() {
  if (scanLoop) { clearInterval(scanLoop); scanLoop = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  document.getElementById('scan-line').style.display = 'none';
  document.getElementById('btn-stop-cam').style.display = 'none';
  document.getElementById('btn-start-cam').style.display = '';
}

function resetScan() {
  stopCam();
  collected = {}; total = null; lastRaw = ''; decoded = '';
  document.getElementById('dots').innerHTML = '';
  document.getElementById('recv-label').textContent = '0 / ? フレーム取得済み';
  document.getElementById('recv-bar').style.width = '0%';
  document.getElementById('result-box').style.display = 'none';
  document.getElementById('camera-placeholder').style.display = 'flex';
  document.getElementById('scan-wrapper').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('btn-start-cam').style.display = '';
  document.getElementById('progress-area').style.display = 'none';
  setBadge('wait', '⏸ 待機中');
}

function doScan() {
  const v = document.getElementById('camera-video');
  if (!v.videoWidth) return;
  const c = document.getElementById('decode-canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0);
  const img = ctx.getImageData(0, 0, c.width, c.height);
  const code = jsQR(img.data, img.width, img.height);
  if (!code || code.data === lastRaw) return;
  lastRaw = code.data;
  try {
    const obj = JSON.parse(code.data);
    if (typeof obj.i !== 'number' || typeof obj.d !== 'string') return;
    if (collected[obj.i] !== undefined) return;
    collected[obj.i] = obj.d;
    total = obj.t;
    updateDots();
    if (Object.keys(collected).length >= total) finish();
  } catch(e) {}
}

function updateDots() {
  const got = Object.keys(collected).length;
  document.getElementById('recv-label').textContent = `${got} / ${total !== null ? total : '?'} フレーム取得済み`;
  if (total) document.getElementById('recv-bar').style.width = (got / total * 100) + '%';
  const container = document.getElementById('dots');
  container.innerHTML = '';
  for (let i = 0; i < (total || got); i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (collected[i] !== undefined ? ' got' : '');
    container.appendChild(d);
  }
}

function finish() {
  stopCam();
  let r = '';
  for (let i = 0; i < total; i++) r += (collected[i] || '');
  decoded = r;
  document.getElementById('result-text').textContent = r;
  document.getElementById('result-box').style.display = 'block';
  setBadge('done', '✓ 受信完了！');
}

function setBadge(type, msg) {
  const b = document.getElementById('badge');
  b.className = 'badge badge-' + type;
  b.textContent = msg;
}

function saveTxt() {
  const blob = new Blob([decoded], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'received.txt';
  a.click();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}
</script>
